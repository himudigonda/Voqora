<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voqora</title>
    <link rel="stylesheet" href="../ui/theme.css">
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <img src="../icons/icon-32.png" width="20" height="20" alt="">
        <h1>Voqora</h1>
      </header>
      <div class="actions">
        <button type="button" class="button primary" id="read-selection" aria-keyshortcuts="Alt+Shift+R">Read Selection</button>
        <button type="button" class="button" id="read-page">Read Page</button>
        <button type="button" class="button" id="stop" aria-keyshortcuts="Alt+Shift+S">Stop</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <footer class="popup-footer">
        <button type="button" class="link-button" id="open-options">Options</button>
        <button type="button" class="link-button" id="open-shortcuts">Shortcuts</button>
      </footer>
    </main>
  </body>
</html>
