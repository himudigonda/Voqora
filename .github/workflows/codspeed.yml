name: CodSpeed

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  codspeed:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Run benchmarks
        uses: CodSpeedHQ/action@6e3823cc2539fc99a552b70a0cde2a5b40ab382a # v4
        with:
          mode: simulation
          run: cd backend && uv run pytest benchmarks/ --codspeed
