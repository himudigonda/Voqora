name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Lint
        working-directory: backend
        run: |
          uv run ruff check .
          uv run black --check .
      - name: Tests
        working-directory: backend
        run: uv run pytest -q
      - name: Locked dependency vulnerability audit
        # Inspect the exact environment created by `uv sync --frozen`; auditing
        # an exported requirements file under the runner's Python can attempt
        # an incompatible resolver install instead of auditing this lockfile.
        working-directory: backend
        run: uvx --from 'pip-audit==2.10.1' pip-audit --path .venv
      - name: Release channel wiring
        run: bash scripts/test_ship_modes.sh
      - name: Coverage
        working-directory: backend
        # 74% is the current verified coverage floor. Coverage below that
        # level should be investigated before merging.
        run: uv run pytest --cov=app --cov-report=term --cov-fail-under=74

  extension:
    name: Browser extension (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tests
        working-directory: extensions/chromium
        run: |
          node --version
          npm test
